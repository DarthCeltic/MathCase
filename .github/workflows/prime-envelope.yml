name: Egyptian-fraction proof and replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prime-envelope.yml"
      - "research/number-theory/egyptian-fractions/prime-envelope-v1/**"
      - "research/number-theory/egyptian-fractions/two-diagonal-envelope-v1/**"
      - "research/number-theory/egyptian-fractions/centered-window-v1/**"
      - "research/number-theory/egyptian-fractions/least-largest-denominator-v1/witnesses.csv"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CASES: research/number-theory/egyptian-fractions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the official Lean 4.33.1 Linux compiler archive
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  lean.tar.zst' | sha256sum --check
          tar --zstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Compile and kernel-check the three proof modules
        working-directory: ${{ env.CASES }}
        run: |
          lean --version
          export LEAN_PATH="$RUNNER_TEMP/proof"
          mkdir -p "$LEAN_PATH"
          replay_module() (
            cd "$1/lean"
            lean -o "$LEAN_PATH/$2.olean" "$2.lean"
            leanchecker -v "$2"
            lean "$3.lean" | tee "$RUNNER_TEMP/$3.log"
            python3 - "$RUNNER_TEMP/$3.log" "$4" <<'PY'
          import re, sys
          from pathlib import Path
          output = Path(sys.argv[1]).read_text()
          reported = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          if len(reported) != int(sys.argv[2]) or any(
              {item.strip() for item in group.split(",")} != allowed for group in reported
          ):
              raise SystemExit("Unexpected theorem count or axiom dependencies")
          PY
          )
          replay_module prime-envelope-v1 PrimeBand Check 4
          lean prime-envelope-v1/lean/MutationControl.lean
          replay_module two-diagonal-envelope-v1 TwoDiagonal CheckTwo 2
          replay_module centered-window-v1 CenteredWindow CheckCentered 4
      - name: Recompute the three published prime sweeps
        working-directory: ${{ env.CASES }}
        run: |
          for package in prime-envelope-v1 two-diagonal-envelope-v1 centered-window-v1; do
            python3 -B "$package/verify.py" --limit 1000000 --direct-through 2000 > "$RUNNER_TEMP/$package.json"
            python3 - "$RUNNER_TEMP/$package.json" "$package/verification.json" <<'PY'
          import json, sys
          from pathlib import Path
          actual, expected = (json.loads(Path(name).read_text()) for name in sys.argv[1:])
          if "run_metadata" in expected:
              print("Hosted replay metadata:", json.dumps(actual["run_metadata"], sort_keys=True))
              for field in ("generated_utc", "command", "python_version"):
                  del actual["run_metadata"][field]
                  del expected["run_metadata"][field]
          if actual != expected:
              raise SystemExit(f"Calculated prime sweep differs from {sys.argv[2]}")
          print(json.dumps(actual["counts"], indent=2))
          PY
          done
          python3 -B prime-envelope-v1/compare_prior.py
          python3 -B two-diagonal-envelope-v1/test_theorem.py
